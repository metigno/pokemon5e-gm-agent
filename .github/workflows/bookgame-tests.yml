name: Bookgame Tests

on:
  push:
    branches:
      - pokemon5e-digital-bookgame
    paths:
      - "bookgame/**"
      - "src/bridge/**"
      - ".github/workflows/bookgame-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Bookgame syntax
        run: |
          node --check bookgame/src/cli.mjs
          node --check bookgame/src/combat/cli-controls.mjs
          node --check bookgame/src/compiler/story-compiler.mjs
          node --check bookgame/src/compiler/cli.mjs
          node --check bookgame/src/engine/compiled-scene-repository.mjs
      - name: Validate authored story graph
        run: npm --prefix bookgame run validate:story
      - name: Run Bookgame tests
        run: npm --prefix bookgame test
