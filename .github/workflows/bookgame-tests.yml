name: Bookgame Tests

on:
  push:
    branches:
      - pokemon5e-digital-bookgame
    paths:
      - "bookgame/**"
      - "src/bridge/**"
      - ".github/workflows/bookgame-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Bookgame CLI syntax
        run: |
          node --check bookgame/src/cli.mjs
          node --check bookgame/src/combat/cli-controls.mjs
      - name: Run Bookgame tests
        run: node --test bookgame/tests/*.test.mjs
