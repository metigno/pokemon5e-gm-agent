name: Bookgame Tests

on:
  push:
    branches:
      - pokemon5e-digital-bookgame
      - bookgame-rc0
      - bookgame-p5e-runtime-full
      - bookgame-canonical
      - bookgame-canonical-integration
    paths:
      - "bookgame/**"
      - "src/bridge/**"
      - ".github/workflows/bookgame-tests.yml"
  pull_request:
    paths:
      - "bookgame/**"
      - "src/bridge/**"
      - ".github/workflows/bookgame-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Bookgame syntax
        run: |
          node --check bookgame/src/cli.mjs
          node --check bookgame/src/combat/cli-controls.mjs
          node --check bookgame/src/compiler/story-compiler.mjs
          node --check bookgame/src/compiler/cli.mjs
          node --check bookgame/src/engine/compiled-scene-repository.mjs
          node --check bookgame/ui/server.mjs
          node --check bookgame/ui/public/app.mjs
          node --check bookgame/ui/public/audio-soundscape.mjs
          node --check bookgame/src/assets/audio-pack.mjs
          node --check bookgame/ui/public/reveal-model.mjs
      - name: Validate authored story graph
        run: npm --prefix bookgame run validate:story
      - name: Run Bookgame tests
        run: npm --prefix bookgame test
      - name: Check native offline host contracts
        run: |
          node --check bookgame/mobile/build.mjs
          node --check bookgame/mobile/runtime/index.cjs
          node --check bookgame/mobile/src/bootstrap.mjs
          node --check bookgame/mobile/scripts/configure-android.mjs
          node bookgame/mobile/build.mjs --contract
      - name: Test audio pack import and checksum gates
        run: python3 -m unittest discover -s bookgame/tests -p 'test_audio_package.py' -v
      - name: Test offline sprite packaging
        run: python3 -m unittest discover -s bookgame/tests -p 'test_sprite_overlay.py' -v
      - name: Test pinned-source sprite materialization
        run: python3 -m unittest discover -s bookgame/tests -p 'test_embed_canonical_sprites.py' -v
      - name: Test offline Trainer bundle installer
        run: python3 -m unittest discover -s bookgame/tests -p 'test_mobile_trainer_overlay.py' -v
      - name: Test secondary World and functional NPC ZIP installer
        run: python3 -m unittest discover -s bookgame/tests -p 'test_secondary_npc_overlay.py' -v

  mobile-runtime-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup embedded Node version
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.4"
      - name: Compile canonical story under embedded runtime version
        run: npm --prefix bookgame run compile:story
      - name: Test mobile host and actual local Story/Save/UI paths
        run: |
          node --test bookgame/tests/mobile-offline-host.test.mjs
          node --test bookgame/tests/mobile-local-auth.test.mjs
          node --test bookgame/tests/ui-server-smoke.test.mjs
          node --test bookgame/tests/compiled-catalogs-live-ui.test.mjs

  mobile-android-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22 for Capacitor 8
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android host dependencies
        working-directory: bookgame/mobile
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate Android native shell (not a playable release)
        working-directory: bookgame/mobile
        run: |
          npm run android:init
          node scripts/configure-android.mjs
      - name: Compile Android native shell without shipping incomplete art
        working-directory: bookgame/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon
