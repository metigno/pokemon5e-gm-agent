name: Historia Web checks
on:
  workflow_dispatch:
  push:
    branches: [historia-web-showdown-integration]
    paths: ['historia-web/**', 'historia/**', '.github/workflows/historia-web.yml']
  pull_request:
    paths: ['historia-web/**', 'historia/**', '.github/workflows/historia-web.yml']
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: historia-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Historia web real simulator unit and E2E tests
        run: npm test
      - name: Canonical tournament and storage regression tests
        run: node --test ../historia/test/*.test.mjs
      - name: Node source syntax
        run: |
          node --check server.mjs
          node --check showdown-engine.mjs
          node --check showdown-protocol.mjs
          node --check battle-service.mjs
          node --check tactical-ai.mjs
          node --check replay-timeline.mjs
          node --check security.mjs
      - name: Embedded client JavaScript syntax
        run: node --input-type=module -e "import fs from 'node:fs';import vm from 'node:vm';const h=fs.readFileSync('index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('Client script missing');new vm.Script(m[1]);"

  browser-mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: historia-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and Linux libraries
        run: npx playwright install --with-deps chromium
      - name: Run desktop and touch-mobile browser E2E
        run: npm run test:browser
      - name: Preserve failing screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historia-playwright-report
          path: |
            historia-web/playwright-report/
            historia-web/test-results/
          retention-days: 7
