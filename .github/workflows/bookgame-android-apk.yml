name: Android offline APK (private assets)
on:
  workflow_dispatch:
  push:
    branches: [bookgame-android-apk-actions-v1]
    paths:
      - '.github/workflows/bookgame-android-apk.yml'
  pull_request:
    branches: [bookgame-canonical]
permissions:
  contents: read
jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate canonical bookgame without private overlays
        run: |
          npm --prefix bookgame test
          npm --prefix bookgame run build
  build-apk:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/bookgame-android-apk-actions-v1')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "Android SDK is available at $ANDROID_HOME"
      - name: Download private offline asset ZIP
        env:
          ASSET_URL: ${{ secrets.P5E_OFFLINE_ASSETS_URL }}
          SWISS_URL: ${{ secrets.SWISSTRANSFERURL }}
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.parse, urllib.request, json, re
          target=pathlib.Path('/tmp/p5e-offline-assets.zip')
          direct=os.environ.get('ASSET_URL','').strip()
          swiss=os.environ.get('SWISS_URL','').strip()
          if direct:
              u=urllib.parse.urlsplit(direct)
              if u.scheme!='https': raise SystemExit('Direct URL must use HTTPS')
              if u.hostname in ('www.swisstransfer.com','swisstransfer.com','drive.google.com','docs.google.com'):
                  raise SystemExit('Page links are not direct downloads; use P5E_SWISSTRANSFER_URL for SwissTransfer')
              urllib.request.urlretrieve(direct,str(target))
          elif swiss:
              u=urllib.parse.urlsplit(swiss)
              if u.scheme!='https' or u.hostname not in ('www.swisstransfer.com','swisstransfer.com'):
                  raise SystemExit('Expected an HTTPS SwissTransfer link')
              m=re.fullmatch(r'/dl/([a-f0-9-]{36})/?',u.path)
              if not m: raise SystemExit('Expected SwissTransfer /dl/<uuid> link')
              transfer_id=m.group(1)
              headers={'User-Agent':'Mozilla/5.0','Accept':'application/json, text/plain, */*'}
              def get_json(url, payload=None):
                  data=None if payload is None else json.dumps(payload).encode()
                  h=dict(headers)
                  if payload is not None: h['Content-Type']='application/json'
                  req=urllib.request.Request(url,data=data,headers=h)
                  with urllib.request.urlopen(req,timeout=60) as resp: return json.load(resp)
              meta=get_json('https://www.swisstransfer.com/api/links/'+transfer_id)
              data=meta.get('data',meta)
              container=data.get('container',{})
              files=container.get('files',[])
              if len(files)!=1: raise SystemExit('Expected exactly one ZIP in SwissTransfer')
              file_id=files[0].get('UUID') or files[0].get('uuid')
              container_id=data.get('containerUUID') or container.get('UUID')
              if not file_id or not container_id: raise SystemExit('SwissTransfer metadata format changed')
              token_response=get_json('https://www.swisstransfer.com/api/generateDownloadToken',
                                      {'password':'','containerUUID':container_id,'fileUUID':file_id})
              token_data=token_response.get('data',token_response)
              token=token_data.get('token') if isinstance(token_data,dict) else token_data
              if not isinstance(token,str) or not token: raise SystemExit('SwissTransfer download token missing')
              host=data.get('downloadHost') or container.get('downloadHost')
              if not host: host='dl-cg6b4xma.swisstransfer.com'
              host=urllib.parse.urlsplit('https://'+host.removeprefix('https://')).hostname
              if not host or not host.endswith('.swisstransfer.com'): raise SystemExit('Invalid download host')
              url=f'https://{host}/api/download/{transfer_id}/{file_id}?'+urllib.parse.urlencode({'token':token})
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=120) as response, target.open('wb') as out:
                  import shutil
                  shutil.copyfileobj(response,out)
          else:
              raise SystemExit('Set SWISSTRANSFERURL or P5E_OFFLINE_ASSETS_URL in Actions secrets')
          import zipfile
          if not zipfile.is_zipfile(target): raise SystemExit('Download was not a ZIP')
          print('Offline asset ZIP downloaded and validated')
          PY
      - name: Install approved offline overlays
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          root=pathlib.Path.cwd().resolve()
          with zipfile.ZipFile('/tmp/p5e-offline-assets.zip') as z:
            for item in z.infolist():
              path=pathlib.PurePosixPath(item.filename)
              if path.is_absolute() or '..' in path.parts or not item.filename.startswith('bookgame/'):
                raise SystemExit('Invalid overlay member: '+item.filename)
              if (item.external_attr >> 16) & 0o170000 == 0o120000:
                raise SystemExit('Symlink forbidden')
              target=root.joinpath(*path.parts)
              if not target.resolve().is_relative_to(root): raise SystemExit('Escaping overlay')
              if item.is_dir(): target.mkdir(parents=True,exist_ok=True); continue
              target.parent.mkdir(parents=True,exist_ok=True)
              with z.open(item) as src, target.open('wb') as dst:
                import shutil; shutil.copyfileobj(src,dst)
          PY
      - name: Verify assets and compile story
        run: |
          npm --prefix bookgame run sprites:verify
          npm --prefix bookgame run sprites:verify:characters
          npm --prefix bookgame run sprites:verify:npc-secondary
          npm --prefix bookgame run audio:verify
          npm --prefix bookgame run build
          npm --prefix bookgame test
      - name: Build Android debug APK
        run: |
          cd bookgame/mobile
          npm install
          npm run android:init
          npm run android:debug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Librogame5e-android-debug
          path: bookgame/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
